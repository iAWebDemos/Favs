<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>Favoritos</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: #151924;
      --card-hover: #1d2332;
      --border: #242b3a;
      --text: #e8ebf2;
      --muted: #7d8699;
      --accent-a: #6d5efc;
      --accent-b: #22d3ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: relative;
      overflow-x: hidden;
      padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 28px);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20% -20% auto -20%;
      height: 60%;
      background: radial-gradient(circle at 50% 0%, rgba(109, 94, 252, 0.25), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(109, 94, 252, 0.35);
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #b9c2d6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
      user-select: none;
    }

    .btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
      opacity: 0.8;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: #323b50;
    }

    .btn:active {
      transform: scale(0.98);
      background: var(--card-hover);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent-b);
      outline-offset: 2px;
    }

    .icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(109, 94, 252, 0.14);
      font-size: 22px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      display: block;
      font-size: 1.02rem;
      font-weight: 600;
    }

    .host {
      display: block;
      margin-top: 3px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      color: var(--muted);
      font-size: 1.2rem;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .btn:hover .arrow {
      transform: translateX(3px);
      color: var(--accent-b);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.75rem;
      color: #4a5366;
    }
  </style>
</head>
<body>
